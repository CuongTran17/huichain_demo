[rosca]
members = 10
periods = 10
contribution = 100.0
period_days = 30
reserve_initial = 0.0

[collateral]
fixed_ratio = 0.50
alpha_min = 0.20
alpha_max = 0.80
require_top_up = false

[reputation]
distribution = "beta"
alpha = 2.0
beta = 2.0
new_member_share = 0.20

[behavior]
decision_mode = "every_due_date"
decision_rule = "deterministic"
reputation_loss = 10000.0
future_access_loss = 10000.0

[prices]
source = "historical"
file = "data/eth_usdt_binance_2021_2026.csv"
start_date = "2022-04-01"
end_date = "2022-12-31"
window_start = "2022-04-01"
normalize = true

[events]
forced_defaults = [
  {position = 0, day = 40},
  {position = 6, day = 221},
]

[experiment]
runs = 100
seed = 42
risk_tolerance = 0.0
