[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "rosca-sim"
version = "0.2.0"
requires-python = ">=3.12"
dependencies = ["mesa==3.5.1", "networkx>=3.4,<4"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]
web = ["streamlit>=1.51,<2", "altair>=5,<7"]

[project.scripts]
rosca-sim = "rosca_sim.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--basetemp=.pytest_tmp"
